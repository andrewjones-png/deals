<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#1E4D5C"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>AIH Deal Reviews</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="dr-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<style id="dr-style">
/* Layout: one 680px reading column; assessment card first, then fixed section cards with tap-to-expand rows. */
:root{
  --bg:#F3F5F6; --surface:#FFFFFF; --sunk:#EBEEF0; --ink:#14202A; --muted:#5A6670; --line:#D9DEE2;
  --accent:#1E4D5C; --accent-soft:#DDEAEE; --on-accent:#FFFFFF;
  --good:#2C7A4B; --good-soft:#E2F1E7; --warn:#A86A12; --warn-soft:#FAEFD9; --bad:#B0281F; --bad-soft:#F8E1DE;
  --f-display:"Newsreader",Georgia,"Times New Roman",serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1418; --surface:#162027; --sunk:#1C272F; --ink:#E6ECEF; --muted:#9AA7B0; --line:#29363F;
  --accent:#86C0D0; --accent-soft:#1D323A; --on-accent:#0E1418;
  --good:#5FC58C; --good-soft:#173226; --warn:#E3B260; --warn-soft:#382D16; --bad:#F0877E; --bad-soft:#3B1E1C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1418; --surface:#162027; --sunk:#1C272F; --ink:#E6ECEF; --muted:#9AA7B0; --line:#29363F;
  --accent:#86C0D0; --accent-soft:#1D323A; --on-accent:#0E1418;
  --good:#5FC58C; --good-soft:#173226; --warn:#E3B260; --warn-soft:#382D16; --bad:#F0877E; --bad-soft:#3B1E1C; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--f-body);-webkit-text-size-adjust:100%}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:-.005em;text-wrap:balance;margin:0}
p{margin:0}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* Gate */
.gate{min-height:100vh;display:grid;place-items:center;padding-inline:16px}
.gate-card{width:100%;max-width:380px;display:grid;gap:18px}
.gate-card h1{font-size:30px;line-height:1.15}
.gate-card .lede{color:var(--muted);font-size:15px}
.field{display:grid;gap:6px}
.field label{font-size:14px;font-weight:500}
.field input[type=password],.field input[type=text]{width:100%;font:500 18px/1.2 var(--f-body);padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.check{display:flex;gap:10px;align-items:center;font-size:15px;min-height:44px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.btn{min-height:48px;border:0;border-radius:10px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:16px;cursor:pointer;padding-inline:18px}
.btn:disabled{opacity:.6}
.err{color:var(--bad);font-size:14px;min-height:20px}
.fine{font-size:13px;color:var(--muted)}
.priv{border-top:1px solid var(--line);padding-top:12px}
.priv strong{color:var(--ink)}

/* Top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:680px;margin:0 auto;padding-inline:16px;display:flex;align-items:center;gap:8px;min-height:52px}
.bar-title{flex:1;min-width:0;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ghost{min-height:40px;padding-inline:12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:14px;font-weight:500;cursor:pointer}
.nav{max-width:680px;margin:0 auto;padding:0 16px 10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:none;min-height:34px;padding-inline:12px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:13px;color:var(--muted);cursor:pointer}

.sample{margin-top:16px;padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:13px;font-weight:500}
.sample.draft{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sample.draft .src{background:var(--surface)}

/* Verdict */
.verdict{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:18px}
.v-head{display:grid;gap:6px}
.v-head h1{font-size:28px;line-height:1.15}
.v-co{color:var(--muted);font-size:14px}
.scale{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.scale div{height:6px;border-radius:3px;background:var(--sunk)}
.scale div.on{background:var(--tone)}
.v-rating{display:grid;gap:8px}
.v-label{font-family:var(--f-display);font-size:22px;font-weight:600;color:var(--tone)}
.bottom{font-size:17px;line-height:1.5}
.v-terms{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.v-terms div{background:var(--surface);padding:10px 12px;display:grid;gap:2px;min-width:0}
.v-terms .k{font-size:12px;color:var(--muted)}
.v-terms .v{font-weight:600;font-size:15px}
.thesis{font-family:var(--f-display);font-style:italic;font-size:18px;line-height:1.45;border-left:3px solid var(--accent);padding-left:12px}
.v-list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.v-list li{display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:start}
.v-list .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:500 12px/1 var(--f-data);background:var(--bad-soft);color:var(--bad);margin-top:2px}
.v-list.you .n{background:var(--accent-soft);color:var(--accent)}
.iss>summary{list-style:none;cursor:pointer;display:grid;gap:4px}
.iss>summary::-webkit-details-marker{display:none}
.iss-hint{display:inline-flex;align-items:center;gap:2px;font-size:13px;font-weight:500;color:var(--accent)}
.iss-hint .chev{width:16px;height:16px;color:var(--accent)}
.iss[open] .iss-hint .chev{transform:rotate(90deg)}
.iss-more{display:grid;gap:10px;margin-top:10px;font-size:15px;padding:12px;border-radius:10px;background:var(--sunk)}
.about{display:grid;gap:0}
.about .para{font-size:15.5px}

/* Section cards */
.sec{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 20px 8px;scroll-margin-top:110px}
.sec-h{display:grid;gap:4px;margin-bottom:10px}
.sec-h h2{font-size:22px}
.sec-sum{font-size:15.5px;margin-bottom:14px}
.counts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.t-good{--tone:var(--good);--tone-soft:var(--good-soft)}
.t-warn{--tone:var(--warn);--tone-soft:var(--warn-soft)}
.t-bad{--tone:var(--bad);--tone-soft:var(--bad-soft)}
.t-acc{--tone:var(--accent);--tone-soft:var(--accent-soft)}
.t-neutral{--tone:var(--muted);--tone-soft:var(--sunk)}
.pill{background:var(--tone-soft);color:var(--tone)}
.grp{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);padding:16px 0 6px}
.grp-sum{font-size:14.5px;color:var(--muted);margin-bottom:8px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--tone);flex:none}

.rows{border-top:1px solid var(--line)}
.row{border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row>summary,.row>.plain{list-style:none;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:14px 0;min-height:52px}
.row>summary{cursor:pointer}
.row>summary::-webkit-details-marker{display:none}
.row .main{min-width:0;display:grid;gap:2px}
.row .t{font-weight:600;font-size:15px}
.row .s{color:var(--muted);font-size:14px}
.chev{width:20px;height:20px;color:var(--muted);transition:transform .15s}
details[open]>summary .chev{transform:rotate(90deg)}
.plain .chev{visibility:hidden}
.row>summary.nolead,.row>.plain.nolead{grid-template-columns:1fr auto}
.more.flush{padding-left:0}
.more{padding:0 0 16px 22px;display:grid;gap:10px;font-size:15px}
.more p+p{margin-top:0}
.kv{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.kv b{color:var(--ink);font-weight:600}
.src{justify-self:start;display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:8px;background:var(--sunk);color:var(--accent);font-size:12.5px;font-weight:500;text-decoration:none;border:0;cursor:pointer;text-align:left}
.score{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:var(--tone-soft);color:var(--tone);font:500 15px/1 var(--f-data)}

/* Business facts */
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-bottom:14px}
.facts div{display:grid;gap:1px;min-width:0}
.facts .k{font-size:12px;color:var(--muted)}
.facts .v{font-size:14.5px;font-weight:500}

/* KPIs */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:4px;align-content:start;min-width:0;background:var(--surface)}
.kpi .k{font-size:12.5px;color:var(--muted)}
.kpi .v{font:500 22px/1.15 var(--f-data);font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12.5px;color:var(--muted)}
.kpi svg{width:100%;height:30px;display:block;margin-top:2px}
.kpi .src{margin-top:4px;padding:3px 8px;font-size:11.5px;background:none;padding-inline:0}
.chart{border-top:1px solid var(--line);padding-block:16px;display:grid;gap:10px}
.chart h3{font-family:var(--f-body);font-size:14px;font-weight:600}
.chart svg{width:100%;height:auto;display:block}
.chart .note{font-size:13.5px;color:var(--muted)}
.share{display:flex;height:22px;border-radius:6px;overflow:hidden;gap:2px}
.share div{background:var(--tone)}
.legend{display:grid;gap:4px;font-size:13.5px}
.legend div{display:flex;align-items:center;gap:8px}
.legend .num{margin-left:auto}

/* Heat map */
.heat{display:grid;grid-template-columns:22px minmax(0,1fr);gap:6px;margin-bottom:16px}
.heat .ylab{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;color:var(--muted);text-align:center;letter-spacing:.06em;text-transform:uppercase}
.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;min-width:0}
.cell{aspect-ratio:1.6;max-width:100%;border-radius:5px;background:var(--tone-soft);display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:2px;padding:2px}
.cell span{min-width:18px;height:18px;border-radius:50%;background:var(--tone);color:var(--surface);font:500 11px/18px var(--f-data);text-align:center}
.xlab{grid-column:2;font-size:11px;color:var(--muted);text-align:center;letter-spacing:.06em;text-transform:uppercase}

.who{font-size:12px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.doc{scroll-margin-top:120px;border-radius:8px;transition:background .6s}
.doc.flash{background:var(--accent-soft)}
.doc .plain{grid-template-columns:auto 1fr auto}
.ext{font-size:13px;color:var(--muted)}

.legend-sec .more{padding-left:0}
.legend-sec h3{font-family:var(--f-body);font-size:14px;font-weight:600;margin-bottom:4px}

footer{margin-top:24px;display:grid;gap:6px;font-size:12.5px;color:var(--muted);text-align:left}
footer strong{color:var(--ink)}


.para{white-space:pre-line}
.vdr{justify-self:start}
.editbar{position:sticky;bottom:0;z-index:6;background:var(--accent);color:var(--on-accent);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:14px}
.editbar .btn{min-height:40px;background:var(--on-accent);color:var(--accent)}
.editbar .ghost{background:transparent;color:var(--on-accent);border-color:var(--on-accent)}
.editing [data-p]{outline:1px dashed var(--line);outline-offset:2px;border-radius:4px;cursor:text;min-width:2ch;display:inline-block}
.editing [data-p]:focus{outline:2px solid var(--accent);background:var(--accent-soft)}
.editing .para[data-p],.editing .bottom[data-p],.editing .thesis[data-p],.editing .sec-sum[data-p]{display:block}
.editing [data-p]:empty::before{content:attr(data-ph);color:var(--muted)}
.editing [data-r]{cursor:pointer;box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--accent)}
.del{border:0;background:var(--bad-soft);color:var(--bad);border-radius:6px;font-size:12px;font-weight:600;padding:3px 8px;cursor:pointer;justify-self:start}
.edithint{font-size:13px;color:var(--muted);margin-top:12px}

.portal-h{margin-top:20px;display:grid;gap:6px}
.portal-h h1{font-size:30px;line-height:1.15}
.portal-h .lede{color:var(--muted);font-size:15px}
.deals{margin-top:16px;display:grid;gap:12px}
.deal{display:grid;gap:6px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;cursor:pointer;font:inherit;color:inherit}
.deal:hover{border-color:var(--accent)}
.deal-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.deal-date{font-size:12.5px;color:var(--muted)}
.deal-name{font-family:var(--f-display);font-size:22px;font-weight:600;line-height:1.2}
.deal-co{font-size:14px;color:var(--muted)}
.deal-who{font-size:14px;font-weight:500}
.deal-dec{justify-self:start;font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--accent);color:var(--on-accent)}
.deal-dec.made{background:var(--accent-soft);color:var(--accent)}
.decide{margin-top:16px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:16px;padding:16px 18px;display:grid;gap:10px}
.decide .eyebrow{color:var(--accent)}
.decide-q{font-size:16px;font-weight:500}
.decide-opts{display:flex;flex-wrap:wrap;gap:8px}
.decide-opts{column-gap:10px}
.decide-opt{display:inline-flex;align-items:center;font-size:15px;font-weight:600;color:var(--accent)}
.decide-opt:not(:last-child)::after{content:"·";margin-left:10px;color:var(--muted)}
.decide-opt.on,.decide-opt.rec{min-height:36px;padding:6px 14px;border-radius:999px;border:1px solid var(--accent)}
.decide-opt.on::after,.decide-opt.rec::after{content:none}
.decide-opt{white-space:nowrap}
.decide-opt.on{background:var(--accent);color:var(--on-accent)}
.decide-opt.rec{border-style:dashed}
.decide-note{font-size:13.5px;color:var(--muted)}
.decide.made{background:var(--surface);border-color:var(--line)}
.deal-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:2px}
.deal-chk{font-size:13px;font-weight:500}
.deal-sum{font-size:14.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}

@media (max-width:380px){.v-terms,.kpis,.facts{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

@media print{
  :root{--bg:#fff;--surface:#fff;--sunk:#f1f3f4;--ink:#111;--muted:#555;--line:#ccc;--accent:#1E4D5C;--accent-soft:#e6eef0;--good:#2C7A4B;--good-soft:#e6f2ea;--warn:#8a5a10;--warn-soft:#f8eedb;--bad:#a3261e;--bad-soft:#f6e1de;color-scheme:light}
  .bar,.nav,.gate,.ghost,.chev,.editbar,.del{display:none!important}
  body{font-size:11pt}
  .wrap{max-width:none;padding:0}
  .sec,.verdict{border:0;padding:0;margin-top:18pt;break-inside:auto}
  .sec-h,.row>summary,.kpi,.chart,.verdict{break-inside:avoid}
  .src{background:none;padding:0;color:#555}
  @page{margin:16mm 14mm}
}
</style>

<div id="gate" class="gate">
  <form id="gateForm" class="gate-card" autocomplete="off">
    <div class="eyebrow">AIH</div>
    <h1>Deal Reviews</h1>
    <p class="lede">These reviews are encrypted. Enter the password you received separately.</p>
    <div class="field">
      <label for="pw">Password</label>
      <input id="pw" type="password" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="off" required>
    </div>
    <label class="check" for="remember"><input id="remember" type="checkbox"> Remember on this device</label>
    <button id="unlockBtn" class="btn" type="submit">Unlock</button>
    <div id="err" class="err" role="alert"></div>
    <p class="fine">Don't tick "Remember" on a shared device. Use Lock to forget it.</p>
<p class="fine priv"><strong>Confidential.</strong> The contents of this site should not be shared with third parties.</p>
  </form>

<script>
(function(){
"use strict";
/* Pristine copies of the page, captured before anything changes, so an edit can republish the whole document. */
const SELF = document.currentScript ? document.currentScript.textContent : '';
const GATE0 = document.getElementById('gate').outerHTML;
const STYLE0 = document.getElementById('dr-style').outerHTML;
const FONTS0 = (document.getElementById('dr-fonts')||{}).outerHTML || '';
const RESET = ':root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}';

const P = JSON.parse(document.getElementById('payload').textContent);
const STORE = 'aihdr:' + P.salt.slice(0,12), SSTORE = 'aihdr-s:' + P.salt.slice(0,12);
const enc = new TextEncoder(), dec = new TextDecoder();
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const tob64 = buf => { const u = new Uint8Array(buf); let s=''; for (let i=0;i<u.length;i+=0x8000) s += String.fromCharCode.apply(null, u.subarray(i,i+0x8000)); return btoa(s); };
const norm = s => s.toLowerCase().replace(/[^a-z]+/g,' ').trim();
const clone = o => JSON.parse(JSON.stringify(o));

let KEY = null, ALL = null, A0 = null, D = null, CUR = -1, EDIT = false, CAN_EDIT = false, ART = null, DIRTY = false;
const slug = d => (d.meta.id || d.meta.codename.replace(/^project\s+/i,'')).toLowerCase().replace(/[^a-z0-9]+/g,'-');

async function deriveKey(pw){
  const base = await crypto.subtle.importKey('raw', enc.encode(norm(pw)), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(P.salt), iterations:P.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, true, ['encrypt','decrypt']);
}
async function decryptWith(key){
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.iv)}, key, b64(P.ct));
  return JSON.parse(dec.decode(pt));
}
function getS(st, k){ try { return st.getItem(k); } catch(e){ return null; } }
function setS(st, k, v){ try { v ? st.setItem(k, v) : st.removeItem(k); } catch(e){} }

const form = document.getElementById('gateForm'), btn = document.getElementById('unlockBtn'), err = document.getElementById('err');
form.addEventListener('submit', async e => {
  e.preventDefault(); err.textContent = ''; btn.disabled = true; btn.textContent = 'Unlocking…';
  try {
    const key = await deriveKey(document.getElementById('pw').value);
    const data = await decryptWith(key);
    if (document.getElementById('remember').checked) setS(localStorage, STORE, tob64(await crypto.subtle.exportKey('raw', key)));
    document.getElementById('pw').value = '';
    open(key, data);
  } catch(x){
    err.textContent = 'That password didn’t work. Check it and try again.';
  } finally { btn.disabled = false; btn.textContent = 'Unlock'; }
});

(async function auto(){
  const s = getS(sessionStorage, SSTORE) || getS(localStorage, STORE); if (!s) return;
  try { const key = await crypto.subtle.importKey('raw', b64(s), 'AES-GCM', true, ['encrypt','decrypt']); open(key, await decryptWith(key)); }
  catch(e){ setS(localStorage, STORE, null); setS(sessionStorage, SSTORE, null); }
})();

function open(key, data){ KEY = key; ALL = data.deals ? data : {deals:[data]}; route(); document.getElementById('gate').hidden = true; document.getElementById('app').hidden = false; checkEdit(); }
function hashId(){ try { return decodeURIComponent((location.hash||'').slice(1)); } catch(e){ return ''; } }
function route(){ const id = hashId(); const i = ALL.deals.findIndex(d => slug(d) === id); CUR = i; D = i >= 0 ? ALL.deals[i] : null; render(); window.scrollTo(0,0); }
let NOHASH = false;
function go(id){ if (EDIT) return; if (!NOHASH) { try { location.hash = id ? id : ''; } catch(e){ NOHASH = true; } } if (hashId() !== (id||'')) { NOHASH = true; const i = ALL.deals.findIndex(d => slug(d) === id); CUR = i; D = i >= 0 ? ALL.deals[i] : null; render(); window.scrollTo(0,0); } }
addEventListener('hashchange', () => { if (KEY && !EDIT) route(); });
function lock(){
  if (EDIT && DIRTY) { EDIT = false; DIRTY = false; }
  setS(localStorage, STORE, null); setS(sessionStorage, SSTORE, null); KEY = null; ALL = null; D = null; CUR = -1; EDIT = false;
  const a = document.getElementById('app'); a.innerHTML=''; a.hidden = true; document.getElementById('gate').hidden = false; window.scrollTo(0,0);
}

/* Editing is offered only to people who can edit the artifact (the author), never to viewers. */
async function checkEdit(){
  try {
    if (!window.claude || !window.claude.use) return;
    const [art, user] = await Promise.all([window.claude.use('artifact'), window.claude.use('user')]);
    if (!art || !user) return;
    const ok = await user.canEdit();
    if (ok && ALL) { ART = art; CAN_EDIT = true; render(true); }
  } catch(e){}
}

/* ---------- paths ---------- */
const getP = (o, p) => p.reduce((a,k) => a == null ? a : a[k], o);
function setP(o, p, v){ const last = p[p.length-1]; const parent = getP(o, p.slice(0,-1)); if (parent) parent[last] = v; }

/* ---------- rendering ---------- */
function h(tag, attrs, ...kids){
  const n = document.createElement(tag);
  if (attrs) for (const k in attrs){ const v = attrs[k]; if (v == null || v === false) continue;
    if (k === 'class') n.className = v; else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v === true ? '' : v); }
  for (const c of kids.flat(Infinity)){ if (c == null || c === false) continue; n.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return n;
}
const NS = 'http://www.w3.org/2000/svg';
function s(tag, attrs, ...kids){ const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); kids.flat().forEach(c => c && n.append(c.nodeType ? c : document.createTextNode(c))); return n; }
const chev = () => { const v = s('svg',{viewBox:'0 0 20 20',class:'chev','aria-hidden':'true'}); v.append(s('path',{d:'M7 4l6 6-6 6',fill:'none',stroke:'currentColor','stroke-width':'2','stroke-linecap':'round','stroke-linejoin':'round'})); return v; };

/* Editable text bound to a path in the deal data. opts: {one:true} single line, {int:true}, {ph:'placeholder'}, {pre:'text before'} */
function E(path, tag, cls, opts){
  opts = opts || {};
  const val = getP(D, path);
  if (!EDIT && (val == null || val === '')) return null;
  const n = h(tag||'span', {class:cls||null, 'data-p':JSON.stringify(path), 'data-1':opts.one?'1':null, 'data-int':opts.int?'1':null, 'data-ph':opts.ph||'Add text'});
  n.textContent = val == null ? '' : String(val);
  if (EDIT) n.setAttribute('contenteditable', 'plaintext-only');
  return n;
}
const para = (path, ph) => E(path, 'div', 'para', {ph: ph||'Add note'});
/* Rating chip bound to a path; tapping it in edit mode cycles through the scale. */
function R(path, scale, el){ if (EDIT) { el.setAttribute('data-r', JSON.stringify(path)); el.setAttribute('data-o', scale); el.setAttribute('title','Tap to change'); } return el; }
const delBtn = path => EDIT ? h('button',{type:'button',class:'del','data-del':JSON.stringify(path)},'Remove') : null;

const RAG = {green:['t-good','Green'], yellow:['t-warn','Yellow'], red:['t-bad','Red'], na:['t-neutral','Not reviewed']};
const VERDICT = [
  ['none','No material concerns identified','t-good'],
  ['conditions','Proceed subject to conditions','t-acc'],
  ['notOnTerms','Material concerns: do not proceed on current terms','t-warn'],
  ['against','Recommend against','t-bad']];
const STATUS = {open:['t-bad','Open'], negotiable:['t-warn','Negotiable'], resolved:['t-good','Resolved'], accepted:['t-neutral','Accept']};
const IMPORTANCE = {must:['t-bad','Must-have'], important:['t-warn','Important'], nice:['t-neutral','Nice-to-have']};
const SCALES = {rag:Object.keys(RAG), status:[''].concat(Object.keys(STATUS)), importance:Object.keys(IMPORTANCE), verdict:VERDICT.map(v=>v[0])};
const band = sc => sc >= 15 ? ['t-bad','High'] : sc >= 8 ? ['t-warn','Medium'] : ['t-good','Low'];

function srcChip(src){
  if (!src) return null;
  const d = (D.documents||[]).find(x => x.id === src.doc); if (!d || !d.url) return null;
  const label = (d.short||d.title) + (src.loc ? ' · ' + src.loc : '') + (src.page ? ' · p.' + src.page : '');
  return h('a', {class:'src', href:d.url, target:'_blank', rel:'noopener'}, '↗ ', label);
}
function row(lead, title, sub, right, bodyKids, del){
  const body = [bodyKids, delBtn(del)].flat(Infinity).filter(Boolean);
  const head = [lead||null, h('div',{class:'main'}, h('div',{class:'t'}, title), sub ? h('div',{class:'s'}, sub) : null), h('div',{style:'display:flex;align-items:center;gap:8px'}, right, chev())];
  const cls = lead ? '' : 'nolead';
  if (!body.length) return h('div',{class:'row'}, h('div',{class:'plain '+cls}, head));
  if (EDIT) return h('div',{class:'row'}, h('div',{class:'plain '+cls}, head), h('div',{class:'more'+(lead?'':' flush')}, body));
  return h('details',{class:'row'}, h('summary',{class:cls}, head), h('div',{class:'more'+(lead?'':' flush')}, body));
}
function section(id, eyebrow, title, summaryPath, ...kids){
  return h('section',{class:'sec', id:'s-'+id}, h('div',{class:'sec-h'}, h('div',{class:'eyebrow'}, eyebrow), h('h2',null,title)), summaryPath ? E(summaryPath,'p','sec-sum',{ph:'Add summary'}) : null, kids);
}
function counts(items, key, map){
  const c = {}; items.forEach(i => c[i[key]] = (c[i[key]]||0)+1);
  return h('div',{class:'counts'}, Object.keys(map).filter(k=>c[k]).map(k => h('span',{class:'pill '+map[k][0]}, c[k]+' '+map[k][1].toLowerCase())));
}
function spark(vals, bad){
  const w=100, ht=28, p=3, mn=Math.min(...vals), mx=Math.max(...vals), r=(mx-mn)||1;
  const pts = vals.map((v,i)=>[p+i*(w-2*p)/(vals.length-1), ht-p-(v-mn)/r*(ht-2*p)]);
  const tone = bad ? 'var(--warn)' : 'var(--accent)';
  const v = s('svg',{viewBox:`0 0 ${w} ${ht}`,preserveAspectRatio:'none','aria-hidden':'true'});

function cancelEdit(){ ALL = clone(A0); D = CUR >= 0 ? ALL.deals[CUR] : null; EDIT = false; DIRTY = false; render(true); }
function markDirty(){ DIRTY = true; const s = document.getElementById('editStatus'); if (s) s.textContent = 'Unsaved changes'; }
const app = document.getElementById('app');
app.addEventListener('input', e => {
  const el = e.target.closest && e.target.closest('[data-p]'); if (!el || !EDIT) return;
  let val = el.innerText.replace(/ /g,' ');
  val = el.dataset['1'] ? val.replace(/\s*\n\s*/g,' ').trim() : val.replace(/\n{3,}/g,'\n\n').replace(/\s+$/,'');
  if (el.dataset.int) { const n = parseInt(val,10); if (isNaN(n)) return; val = Math.max(1, Math.min(5, n)); }
  setP(D, JSON.parse(el.dataset.p), val); markDirty();
});
app.addEventListener('keydown', e => { const el = e.target.closest && e.target.closest('[data-1]'); if (el && EDIT && e.key === 'Enter') { e.preventDefault(); el.blur(); } });
app.addEventListener('focusout', e => { const el = e.target.closest && e.target.closest('[data-int]'); if (el && EDIT) render(true); });
app.addEventListener('click', e => {
  if (!EDIT) return;
  const r = e.target.closest('[data-r]');
  if (r) { e.preventDefault(); const p = JSON.parse(r.dataset.r), opts = r.dataset.o === 'decision' ? [''].concat(D.decision.options) : SCALES[r.dataset.o], cur = getP(D,p) == null ? '' : getP(D,p); setP(D, p, opts[(opts.indexOf(cur)+1) % opts.length]); markDirty(); render(true); return; }
  const d = e.target.closest('[data-del]');
  if (d) { e.preventDefault(); const p = JSON.parse(d.dataset.del), arr = getP(D, p.slice(0,-1)); arr.splice(p[p.length-1], 1); markDirty(); render(true); return; }
  const a = e.target.closest('[data-add]');
  if (a) { e.preventDefault(); const arr = getP(D, JSON.parse(a.dataset.add)); arr.push(''); markDirty(); render(true); return; }
});

async function save(){
  const b = document.getElementById('saveBtn'), st = document.getElementById('editStatus');
  if (!ART || !KEY) return;
  b.disabled = true; st.textContent = 'Saving…';
  try {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, KEY, enc.encode(JSON.stringify(ALL)));
    const NP = Object.assign({}, P, {iv: tob64(iv), ct: tob64(ct)});
    const esc = x => String(x).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    const body = '<title>AIH Deal Reviews</title>\n<meta name="robots" content="noindex,nofollow">\n' + FONTS0 + '\n' + STYLE0 + '\n\n' + GATE0 + '\n\n<div id="app" hidden></div>\n\n<script id="payload" type="application/json">' + JSON.stringify(NP) + '<\/script>\n<script>' + SELF + '<\/script>\n';
    const html = '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + RESET + '</style></head><body>' + body + '</body></html>';
    setS(sessionStorage, SSTORE, tob64(await crypto.subtle.exportKey('raw', KEY)));
    await ART.publish(html);
    DIRTY = false; st.textContent = 'Saved';
  } catch(x){
    const code = x && x.code;
    if (code === 'conflict') st.textContent = 'A newer version was saved elsewhere. Reloading it; your edits weren’t saved.';
    else if (code === 'not_writer' || code === 'not_granted') { st.textContent = 'This view can’t save changes.'; CAN_EDIT = false; }
    else st.textContent = 'Couldn’t save' + (x && x.message ? ': ' + x.message : '') + '. Try again.';
    b.disabled = false;
  }
}
